# Full nginx site for intrainteriors.co  ->  /etc/nginx/sites-available/intrainteriors.co
#   sudo ln -s /etc/nginx/sites-available/intrainteriors.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d intrainteriors.co -d www.intrainteriors.co     # adds HTTPS (listen 443) automatically
#
# Without a server block whose server_name is intrainteriors.co, nginx answers with its DEFAULT site
# (e.g. unixova.com) — that is why /cms showed another domain.
# If an intrainteriors.co block already exists (e.g. for the main website), copy only the two
# "location" blocks below into it instead of adding this whole file.

server {
    listen 80;
    listen [::]:80;
    server_name intrainteriors.co www.intrainteriors.co;

    # Main website on "/" (optional) — leave as-is if another site already serves it
    # root /var/www/intrainteriors;
    # index index.html;

    location = /cms { return 301 /cms/; }

    location /cms/ {
        proxy_pass         http://127.0.0.1:5055;   # no trailing slash: keeps the /cms prefix (BASE_PATH=/cms)
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;                   # file uploads (app limit is 20MB)
        proxy_read_timeout 60s;
    }
}
